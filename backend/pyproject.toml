[project]
name = "mu-timetable-backend"
version = "0.1.0"
description = "MU College Timetable Backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.110.0",
    "greenlet>=3.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ASYNC", "TID", "UP", "RUF"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests".msg = "Sync HTTP banned. Use httpx.AsyncClient. See AGENTS.md."
"psycopg2".msg = "Sync DB driver banned. Use asyncpg via SQLAlchemy async engine. See AGENTS.md."
"time.sleep".msg = "Blocks event loop. Use asyncio.sleep. See AGENTS.md."
"sqlalchemy.orm.Session".msg = "Sync Session banned. Use sqlalchemy.ext.asyncio.AsyncSession. See AGENTS.md."

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
exclude = ["**/migrations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=app --cov-fail-under=70"
